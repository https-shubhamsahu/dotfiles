# Loaded by systemd for the whole niri session, so every terminal and app sees it.
ANDROID_HOME=$HOME/Android/Sdk
ANDROID_SDK_ROOT=$HOME/Android/Sdk
JAVA_HOME=/usr/lib/jvm/java-21-openjdk
PATH=$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/development/flutter/bin:$HOME/.pub-cache/bin:$HOME/Android/Sdk/platform-tools:$HOME/Android/Sdk/cmdline-tools/latest/bin:$HOME/.cargo/bin:$HOME/go/bin:${PATH}
# Java apps (Android Studio) misdraw under tiling compositors without this
_JAVA_AWT_WM_NONREPARENTING=1
# Electron/Chromium apps run native Wayland
ELECTRON_OZONE_PLATFORM_HINT=auto
# HyperFrames + ElevenLabs needs serial TTS
HYPERFRAMES_TTS_CONCURRENCY=1
