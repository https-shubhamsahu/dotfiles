# Keeps Gradle from eating the 16 GB. Values here override each project's android/gradle.properties
# (Flutter's template asks for -Xmx8G). Raise -Xmx to 4g if an R8 release build runs out of memory.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.daemon.idletimeout=900000
org.gradle.workers.max=6
org.gradle.parallel=true
org.gradle.caching=true
